name: Update Bioconductor Code Metrics

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      force_full:
        description: "Re-analyze every package from scratch, ignoring the prior database."
        type: boolean
        default: false
      recollect:
        description: "Backfill packages whose rows predate the binary metrics, in place (no wipe)."
        type: boolean
        default: false
      time_budget_seconds:
        description: "Stop starting new shards after this many seconds (default 18000 = 5h)."
        default: "18000"

permissions:
  contents: write

concurrency:
  group: bioc-code-metrics-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::RSQLite
            any::DBI
            any::jsonlite
            any::digest
            any::testthat
            any::withr

      - name: Install rpkg-analyzer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$HOME/.local/bin"
          gh release download v0.4.0 --repo r-observatory/rpkg-analyzer \
            --pattern 'rpkg-analyzer-linux-x86_64.tar.gz' --dir /tmp
          tar -xzf /tmp/rpkg-analyzer-linux-x86_64.tar.gz -C "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/rpkg-analyzer"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "RPKG_ANALYZER_BIN=$HOME/.local/bin/rpkg-analyzer" >> "$GITHUB_ENV"
          "$HOME/.local/bin/rpkg-analyzer" --sexp <(echo 'x <- 1') >/dev/null && echo "rpkg-analyzer ready"

      - name: Run unit tests
        run: Rscript tests/testthat.R

      - name: Download the latest databases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p out
          # latest_tag resolves published releases only; a draft is what an
          # interrupted publish leaves, never a release to build on.
          source scripts/publish.sh

          # A single consolidated release per day (metrics-YYYY-MM-DD) carries both
          # the code and data DBs as assets. Fall back to the legacy split code-/data-
          # tags on the first run after the consolidation so the in-flight bootstrap
          # (the prior code DB) is not lost.
          METRICS_TAG=$(latest_tag metrics)
          CODE_SRC="${METRICS_TAG:-$(latest_tag code)}"
          DATA_SRC="${METRICS_TAG:-$(latest_tag data)}"
          echo "prior metrics tag: ${METRICS_TAG:-none}; code src: ${CODE_SRC:-none}; data src: ${DATA_SRC:-none}"

          # This pipeline is incremental: the prior release's database IS the
          # accumulated state, and a run that starts without it rebuilds from
          # empty and publishes that as latest, green. cran-queue lost 323,063
          # snapshots covering four months exactly that way on 2026-07-16, when
          # a single 503 on the asset download was swallowed by `|| true`. So
          # every fetch below retries, a zero-length file counts as a failed
          # download, and a release that advertises an asset we cannot get
          # fails the run. "No prior release" stays distinguishable from "the
          # download failed" because it is the resolved tag, not the presence
          # of a file, that says which one we are in, and a cold start (empty
          # tag) still works.
          list_assets() {
            local tag="$1" dest="$2" n
            for n in 1 2 3 4 5; do
              if gh release view "$tag" --json assets -q '.assets[].name' > "$dest"; then
                return 0
              fi
              echo "attempt ${n}: could not list the assets of ${tag}"
              if [ "$n" -lt 5 ]; then sleep $((n * 10)); fi
            done
            return 1
          }

          have_asset() { grep -qxF "$2" "out/.assets-$1"; }

          get_asset() {
            local tag="$1" name="$2" n
            for n in 1 2 3 4 5; do
              rm -f "out/$name"
              if gh release download "$tag" --pattern "$name" --dir out && [ -s "out/$name" ]; then
                echo "fetched ${name} from ${tag} ($(stat -c%s "out/$name") bytes)"
                return 0
              fi
              echo "attempt ${n}: ${name} did not arrive from ${tag}, or arrived empty"
              if [ "$n" -lt 5 ]; then sleep $((n * 10)); fi
            done
            echo "::error::${tag} lists ${name} as an asset but five attempts failed to fetch a non-empty copy. Refusing to continue: this run would rebuild from an empty database and publish it as latest."
            exit 1
          }

          # A publish or a heartbeat replaces an asset by uploading it under
          # swap-next-<name> and renaming it into place. Interrupted between
          # those two renames, it leaves the release carrying the bytes under
          # swap-prev-<name> and nothing under the name itself, and from here
          # that is indistinguishable from a release that never carried a
          # database: the listing below would not find it, and preflight would
          # refuse the release this run resolved. The repair puts the name
          # back, by asset id, and does nothing at all when there is nothing to
          # put back. scripts/publish.sh says what each leftover state means.
          if [ "$CODE_SRC" = "$DATA_SRC" ]; then
            repair_release "$CODE_SRC" bioc-code-metrics.db bioc-data-metrics.db \
              code-manifest.json data-manifest.json || exit 1
          else
            repair_release "$CODE_SRC" bioc-code-metrics.db code-manifest.json || exit 1
            repair_release "$DATA_SRC" bioc-data-metrics.db data-manifest.json || exit 1
          fi

          # The series whose databases the resolved release actually carries.
          # preflight.R reads this to tell a cold start apart from a download
          # that came back with nothing in it.
          EXPECT=()
          if [ -n "$CODE_SRC" ]; then
            if ! list_assets "$CODE_SRC" "out/.assets-${CODE_SRC}"; then
              echo "::error::could not read the asset list of ${CODE_SRC}; refusing to guess whether it carries a database."
              exit 1
            fi
            if have_asset "$CODE_SRC" bioc-code-metrics.db; then
              get_asset "$CODE_SRC" bioc-code-metrics.db
              EXPECT+=(code)
            fi
            # code-manifest.json only. The pre-split manifest.json cannot serve
            # as a baseline: it carries no series, so preflight.R cannot tell
            # which database it describes, and a tag whose manifest is missing
            # gets checked against its own row counts instead.
            if have_asset "$CODE_SRC" code-manifest.json; then
              get_asset "$CODE_SRC" code-manifest.json
              mv out/code-manifest.json out/prev-code-manifest.json
            fi
          fi
          if [ -n "$DATA_SRC" ]; then
            if [ "$DATA_SRC" != "$CODE_SRC" ] && ! list_assets "$DATA_SRC" "out/.assets-${DATA_SRC}"; then
              echo "::error::could not read the asset list of ${DATA_SRC}; refusing to guess whether it carries a database."
              exit 1
            fi
            if have_asset "$DATA_SRC" bioc-data-metrics.db; then
              get_asset "$DATA_SRC" bioc-data-metrics.db
              EXPECT+=(data)
            fi
            if have_asset "$DATA_SRC" data-manifest.json; then
              get_asset "$DATA_SRC" data-manifest.json
              mv out/data-manifest.json out/prev-data-manifest.json
            fi
          fi

          # A download can succeed and still hand back a file with nothing in
          # it, so check each database's row counts against the manifest
          # published with it before any shard writes to it. Rows, not bytes:
          # the file size moves for reasons that have nothing to do with what
          # was collected.
          #
          # The resolved tags go along because the assets alone cannot tell a
          # cold start from a release that carries nothing: both advertise no
          # database and no manifest, and only the second one had a tag.
          Rscript scripts/preflight.R out/ --code-src="$CODE_SRC" --data-src="$DATA_SRC" "${EXPECT[@]}"

          # Snapshot the pre-run package set so the release notes can tag
          # each changed package as new-to-the-catalog vs updated. Always
          # write the file (empty when there is no prior code DB) so the
          # renderer never has to special-case its absence.
          sqlite3 out/bioc-code-metrics.db "SELECT DISTINCT package FROM bioc_code_summary" > out/seed-packages.txt 2>/dev/null || : > out/seed-packages.txt

          echo "PREV_CODE_TAG=${CODE_SRC}" >> "$GITHUB_ENV"
          echo "PREV_DATA_TAG=${DATA_SRC}" >> "$GITHUB_ENV"
          ls -la out || true

      - name: Analyze shards and publish after each
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES_TITLE_PREFIX: Bioconductor
        run: |
          set -euo pipefail
          BUDGET="${{ inputs.time_budget_seconds || '18000' }}"
          FORCE=""; [ "${{ inputs.force_full }}" = "true" ] && FORCE="--bootstrap"
          RECOLLECT=""; [ "${{ inputs.recollect }}" = "true" ] && RECOLLECT="--recollect"
          TODAY="$(date -u +%Y-%m-%d)"
          METRICS_TAG="metrics-${TODAY}"
          MAX_BYTES=2040109465

          # scripts/publish.sh holds publish_release and refresh_heartbeat,
          # which never leave a draft to build on and fail the step when an
          # upload does not land.
          source scripts/publish.sh

          # Publish ONE dated release carrying both the code and data metrics DBs
          # (plus both manifests) as assets, with a single notes body. render_notes.R
          # writes the same catalog to release-notes-code.md/-data.md, so either is
          # the combined body; we attach the code one.
          publish_metrics() {
            local f bytes
            for f in bioc-code-metrics.db bioc-data-metrics.db; do
              bytes=$(file_bytes "out/$f") || return 1
              if [ "$bytes" -gt "$MAX_BYTES" ]; then
                echo "::error::out/$f is ${bytes} bytes (> ${MAX_BYTES}); refusing to publish ${METRICS_TAG}."
                return 1
              fi
            done
            # Stamp the title with the publish time so a same-day republish is
            # visibly a fresh update (the dated tag stays daily for retention
            # pruning; replacing an asset does not move the release's published
            # timestamp).
            local stamp title
            stamp=$(date -u +'%H:%M') || return 1
            title="Bioconductor Metrics - ${TODAY} (updated ${stamp} UTC)"
            publish_release "$METRICS_TAG" "$title" out/release-notes-code.md \
              out/bioc-code-metrics.db out/bioc-data-metrics.db \
              out/code-manifest.json out/data-manifest.json || return 1
          }

          shard=0
          published=0
          while :; do
            shard=$((shard + 1))
            echo "=== shard ${shard} (elapsed ${SECONDS}s) ==="
            Rscript scripts/update.R out/ ${FORCE} ${RECOLLECT}
            FORCE=""

            CHANGED=$(jq -r '.changed' out/run-status.json)
            COMPLETE=$(jq -r '.bootstrap_complete' out/run-status.json)
            echo "shard ${shard}: changed=${CHANGED} complete=${COMPLETE} analyzed=$(jq -r .n_analyzed out/run-status.json)/$(jq -r .n_universe out/run-status.json)"

            if [ "$CHANGED" = "true" ]; then
              Rscript scripts/render_notes.R out/
              publish_metrics || exit 1
              published=1
            fi

            if [ "$COMPLETE" = "true" ] || [ "$CHANGED" != "true" ]; then
              echo "Nothing left to do (complete=${COMPLETE}, changed=${CHANGED})."
              break
            fi
            [ "$SECONDS" -ge "$BUDGET" ] && { echo "Time budget reached."; break; }
          done

          # A run that never reached Bioconductor comes back with an empty
          # universe, and from there it is shaped exactly like a healthy
          # months-of-silence run: nothing to analyze, nothing changed, nothing
          # published, exit 0. available.packages() warns rather than errors when
          # the repos are unreachable, so no error escapes to stop the run.
          # Refreshing the freshness manifests here would report a pipeline that
          # cannot see upstream as current, and leaving them stale is the only
          # signal anything downstream would ever get.
          N_UNIVERSE=$(jq -r '.n_universe // 0' out/run-status.json)
          if [ "$N_UNIVERSE" -eq 0 ]; then
            echo "::error::The Bioconductor package universe came back empty, so this run never reached upstream. Not refreshing the freshness manifests."
            exit 1
          fi

          if [ "$published" -eq 0 ]; then
            refresh_heartbeat "${PREV_CODE_TAG:-}" out/code-manifest.json out/data-manifest.json || exit 1
          fi

      - name: Prune old dated releases
        if: ${{ github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP: "30"
        run: |
          set -euo pipefail
          # Prune only the consolidated metrics- series. Legacy code-/data- releases
          # are left untouched here and removed by a one-time cleanup once the new
          # scheme is confirmed. Drafts are left out so they do not take one of
          # the KEEP slots from a real release.
          gh release list --exclude-drafts --limit 1000 --json tagName -q '.[].tagName' \
            | { grep "^metrics-" || true; } \
            | Rscript scripts/prune.R \
            | while read -r tag; do
                [ -n "$tag" ] || continue
                echo "pruning $tag"
                gh release delete "$tag" --yes --cleanup-tag || true
              done

          # That listing leaves drafts out, and a publish replaces a draft only
          # under its own day's tag, so the draft of a publish that failed on an
          # earlier day is deleted here or never. scripts/publish.sh says why
          # this goes by id.
          # shellcheck source=scripts/publish.sh
          source scripts/publish.sh
          delete_stale_drafts metrics "metrics-$(date -u +%Y-%m-%d)" || exit 1

          # Replacing an asset leaves the copy it displaced under
          # swap-prev-<name>, for a reader that is still pulling it, and the
          # next replacement under that tag clears it. Tomorrow publishes under
          # a new tag and never comes back to today's, so this step is the only
          # thing that visits a release again after its day, and without it
          # every kept release would hold a second copy of both databases for
          # good.
          sweep_swap_leftovers metrics "metrics-$(date -u +%Y-%m-%d)" || exit 1
